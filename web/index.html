<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiceFight2026</title>
    <!-- Installable as an app (2026-10-19): Add to Home Screen opens Dice
         Kingdom's mobile page full-screen. No service worker - every launch
         loads the live site, so a deploy is never hidden behind a cache.
         Icons come from web/icons/app-icon.svg. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Dice Kingdom" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9ecf2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b3143" />
    <!-- Used only by the Dice Kingdom (/dice-kingdom) route's .dicekingdom-scoped
         CSS - loaded globally since a SPA can't scope a <link> to one route,
         but no other page references these families. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
